<div class="product-box-view" data-box="{{ box_id }}" tabindex="0" role="group" aria-label="Interactive {{ box_name }} carton. Move your mouse, drag horizontally, or use arrow keys to turn the box.">
  <div class="product-box-stage">
    <div class="product-box-model" aria-hidden="true">
      <canvas class="box-face box-front"></canvas>
      <canvas class="box-face box-right"></canvas>
      <canvas class="box-face box-left"></canvas>
      <canvas class="box-face box-top"></canvas>
      <div class="box-face box-bottom"></div>
    </div>
  </div>
  <img class="product-box-fallback" src="{{ box_front }}" alt="{{ box_name }} pharmaceutical carton" loading="lazy" />
  <div class="product-box-hint"><button class="product-box-toggle" type="button" aria-label="Pause automatic rotation">Pause</button></div>
</div>
