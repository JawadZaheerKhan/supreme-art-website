  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html"><img src="{{ site.logo }}" alt="Supreme Art" class="brand__logo" /></a>
      <button class="menu-btn" type="button" aria-controls="mainmenu" aria-expanded="false">
        <span class="menu-btn__label">Menu</span>
        <span class="menu-btn__circle" aria-hidden="true"><i></i><i></i></span>
      </button>
    </div>

    <div class="menu-panel" id="mainmenu">
      <div class="container menu-panel__inner">
        {{#each menu}}<nav class="menu-col">
          {{#each links}}<a href="{{ href }}"{{#if current}} class="current"{{/if}}>{{ label }}</a>
          {{/each}}
        </nav>
        {{/each}}<div class="menu-col menu-col--meta">
          <a class="menu-quote" href="{{ site.nav.cta.href }}">{{ site.nav.cta.label }}</a>
          <a class="menu-meta__line" href="tel:{{ site.contact.phone_link }}">{{ site.contact.phone }}</a>
          <a class="menu-meta__line" href="tel:{{ site.contact.phone_secondary_link }}">{{ site.contact.phone_secondary }}</a>
          <a class="menu-meta__line" href="mailto:{{ site.contact.email }}">{{ site.contact.email }}</a>
          <p class="menu-meta__line menu-meta__addr">{{ site.contact.address }}</p>
        </div>
      </div>
    </div>
  </header>
