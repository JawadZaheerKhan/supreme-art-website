  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html"><img src="{{ site.logo }}" alt="Supreme Art" class="brand__logo" /></a>
      <nav class="nav-links">
        {{#each nav}}{{#if dropdown}}<span class="has-dropdown">
          <a href="{{ href }}"{{#if current}} class="current"{{/if}}>{{ label }}</a>
          <span class="dropdown">
            {{#each dropdown}}<a href="{{ href }}">{{ label }}</a>
            {{/each}}
          </span>
        </span>
        {{else}}<a href="{{ href }}"{{#if current}} class="current"{{/if}}>{{ label }}</a>
        {{/if}}{{/each}}<a href="{{ site.nav.cta.href }}" class="nav-cta">{{ site.nav.cta.label }}</a>
      </nav>
    </div>
  </header>
