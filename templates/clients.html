<!DOCTYPE html>
<html lang="en">
<head>
{{> head}}
  <link rel="stylesheet" href="/product-box.css" />
  <link rel="stylesheet" href="/clients-page.css" />
</head>
<body>
{{> gtm-body}}
{{> loader}}
{{> header}}

  <main>
{{> banner}}
    <section class="section clients-page">
      <div class="container">
        <p class="clients-page__intro">{{ page.intro }}</p>
        <!-- One client per row: its logo floating beside the same turning carton that the Services page shows for it. -->
        <ul class="clients-page__list">
          {{#each page.items}}<li class="client-pair">
            <div class="client-pair__logo"><img src="{{ logo }}" alt="{{ client }}" loading="lazy" decoding="async" /></div>
            <div class="client-pair__box">
              {{> product-box}}
              <p class="client-pair__caption"><strong>{{ product }}</strong><span>{{ note }}</span></p>
            </div>
          </li>
          {{/each}}
        </ul>
        <div class="clients-page__cta">
          <h2>{{ page.cta.heading }}</h2>
          <p>{{ page.cta.text }}</p>
          <a class="btn btn--accent" href="{{ page.cta.href }}">{{ page.cta.label }}</a>
        </div>
      </div>
    </section>
  </main>

{{> footer}}

  <script src="/script.js"></script>
  <script src="/product-box-syrups.js"></script><script src="/product-box-food.js"></script><script src="/product-box-neutra.js"></script><script src="/product-box.js"></script>
</body>
</html>
